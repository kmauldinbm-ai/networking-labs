<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610">
<rect width="1100" height="610" fill="#fff"/>
<style>
text{font-family:Arial,sans-serif;fill:#172033}.router{fill:#e9f2ff;stroke:#245b9e;stroke-width:2}.switch{fill:#eef2f7;stroke:#536273;stroke-width:2}.pc{fill:#f4fce8;stroke:#578129;stroke-width:2}.link{stroke:#263746;stroke-width:3;fill:none}.label{font-size:15px}.small{font-size:13px;fill:#4b5563}.title{font-weight:bold;font-size:23px}
</style>
<text x="550" y="36" text-anchor="middle" class="title">DHCP Relay and OSPF Multi-Router Lab</text>
<!-- transit links -->
<path class="link" d="M550 125 L550 210 M630 250 L825 250 M550 290 L550 390 M865 290 L865 390 M590 435 L825 435"/>
<!-- DHCP link -->
<path class="link" d="M230 125 L470 225"/>
<!-- client LANs -->
<path class="link" d="M470 435 L350 435 M270 435 L160 435"/>
<path class="link" d="M905 435 L970 435 M1045 435 L1070 435"/>
<!-- routers -->
<rect class="router" x="475" y="75" width="150" height="70" rx="12"/><text x="550" y="105" text-anchor="middle" class="label">DHCP Router</text><text x="550" y="128" text-anchor="middle" class="small">DHCP scopes</text>
<rect class="router" x="470" y="215" width="160" height="75" rx="12"/><text x="550" y="245" text-anchor="middle" class="label">R1</text><text x="550" y="268" text-anchor="middle" class="small">OSPF transit</text>
<rect class="router" x="825" y="215" width="80" height="75" rx="12"/><text x="865" y="247" text-anchor="middle" class="label">R2</text><text x="865" y="270" text-anchor="middle" class="small">OSPF</text>
<rect class="router" x="470" y="390" width="120" height="90" rx="12"/><text x="530" y="425" text-anchor="middle" class="label">R3</text><text x="530" y="448" text-anchor="middle" class="small">DHCP relay</text>
<rect class="router" x="825" y="390" width="80" height="90" rx="12"/><text x="865" y="425" text-anchor="middle" class="label">R4</text><text x="865" y="448" text-anchor="middle" class="small">DHCP relay</text>
<!-- switches and endpoints -->
<rect class="switch" x="270" y="405" width="80" height="60" rx="8"/><text x="310" y="441" text-anchor="middle" class="label">SW1</text>
<rect class="pc" x="90" y="405" width="70" height="60" rx="8"/><text x="125" y="441" text-anchor="middle" class="label">PC1</text>
<rect class="switch" x="970" y="405" width="75" height="60" rx="8"/><text x="1007" y="441" text-anchor="middle" class="label">SW2</text>
<rect class="pc" x="1070" y="405" width="30" height="60" rx="6"/><text x="1085" y="492" text-anchor="middle" class="small">PC2</text>
<!-- interface labels -->
<text x="565" y="168" class="small">G0/0 ↔ G0/0</text>
<text x="666" y="238" class="small">R1 G0/1 ↔ R2 G0/1</text>
<text x="563" y="347" class="small">G0/2 ↔ G0/2</text>
<text x="872" y="345" class="small" transform="rotate(90 872 345)">R2 G0/0 ↔ R4 G0/0</text>
<text x="656" y="423" class="small">R3 G0/0 ↔ R4 G0/1</text>
<text x="385" y="423" class="small">R3 G0/1 → SW1 G0/1 → PC1</text>
<text x="920" y="423" class="small">R4 G0/2 → SW2 G0/2 → PC2</text>
<text x="550" y="545" text-anchor="middle" class="small">OSPF runs on R1–R4; DHCP requests from both client LANs are relayed toward the DHCP router.</text>
</svg>